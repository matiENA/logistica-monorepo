<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no" />
    <title>Coordinación · Tablero de Planeación</title>
    <meta name="theme-color" content="#EDEDED" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;500;600;700&family=Roboto:wght@300;400;500;700&family=Zilla+Slab:ital,wght@0,400;0,500;0,600;1,400&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Roboto', 'system-ui', 'sans-serif'],
              mono: ['"Roboto Mono"', 'monospace'],
              notes: ['"Zilla Slab"', 'serif'],
              plate: ['"Roboto Mono"', 'sans-serif'],
            },
          },
        },
      };
    </script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>

  </head>
  <body class="bg-[#EDEDED] text-zinc-950 font-sans antialiased select-none h-screen w-screen overflow-hidden">
    <div id="root" class="h-full w-full"></div>

    <script type="text/babel">
      const { useState, useEffect, useMemo, useCallback, useRef } = React;

      const isLocalHost =
        window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
      const API_BASE =
        window.BACKEND_URL ||
        (isLocalHost ? 'http://localhost:4000' : 'https://diaria-operativas.onrender.com');

      // --- UTILITARIOS FORMATO PATENTES MERCOSUR Y NACIONAL ---
      function formatPlateDisplay(raw) {
        const clean = (raw || '').replace(/[\s-]/g, '').toUpperCase();
        if (!clean) return '---';
        const mercosur = clean.match(/^([A-Z]{2})(\d{3})([A-Z]{2})$/);
        if (mercosur) return `${mercosur[1]} ${mercosur[2]} ${mercosur[3]}`;
        const nacional = clean.match(/^([A-Z]{3})(\d{3})$/);
        if (nacional) return `${nacional[1]} ${nacional[2]}`;
        return clean;
      }

      function formatDateTimeShort(iso) {
        if (!iso) return '';
        const d = new Date(iso);
        if (Number.isNaN(d.getTime())) return '';
        const isToday = d.toDateString() === new Date().toDateString();
        if (isToday) {
          return d.toLocaleTimeString('es-AR', { hour: '2-digit', minute: '2-digit', hour12: false });
        }
        return d.toLocaleString('es-AR', {
          day: '2-digit',
          month: '2-digit',
          hour: '2-digit',
          minute: '2-digit',
          hour12: false,
        });
      }

      function formatRelativeTime(iso) {
        if (!iso) return '';
        const d = new Date(iso);
        if (Number.isNaN(d.getTime())) return '';
        const diffMs = Date.now() - d.getTime();
        const diffMin = Math.floor(diffMs / 60000);
        if (diffMin < 1) return 'Recién';
        if (diffMin < 60) return `Hace ${diffMin}m`;
        const diffH = Math.floor(diffMin / 60);
        if (diffH < 24) return `Hace ${diffH}h ${diffMin % 60}m`;
        return d.toLocaleDateString('es-AR', { day: '2-digit', month: '2-digit' });
      }

      // --- ICONOS FLAT SVG NATIVOS (Cero-Bloat / Lucide Compatible) ---
      const Icons = {
        Search: ({ className = 'w-4 h-4' }) => (
          <svg className={className} fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        ),
        Refresh: ({ className = 'w-4 h-4' }) => (
          <svg className={className} fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24"><path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"/><path d="M16 21h5v-5"/></svg>
        ),
        RotateCcw: ({ className = 'w-4 h-4' }) => (
          <svg className={className} fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
        ),
        Plus: ({ className = 'w-4 h-4' }) => (
          <svg className={className} fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
        ),
        ArrowUpDown: ({ className = 'w-4 h-4' }) => (
          <svg className={className} fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24"><path d="m21 16-4 4-4-4"/><path d="M17 20V4"/><path d="m3 8 4-4 4 4"/><path d="M7 4v16"/></svg>
        ),
        Truck: ({ className = 'w-4 h-4' }) => (
          <svg className={className} fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24"><path d="M14 18V6a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2v11a1 1 0 0 0 1 1h2"/><path d="M15 18H9"/><path d="M19 18h2a1 1 0 0 0 1-1v-3.65a1 1 0 0 0-.22-.624l-3.48-4.35A1 1 0 0 0 17.52 8H14"/><circle cx="17" cy="18.5" r="2.5"/><circle cx="7" cy="18.5" r="2.5"/></svg>
        ),
        MapPin: ({ className = 'w-4 h-4' }) => (
          <svg className={className} fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>
        ),
        User: ({ className = 'w-4 h-4' }) => (
          <svg className={className} fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        ),
        LogOut: ({ className = 'w-4 h-4' }) => (
          <svg className={className} fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" x2="9" y1="12" y2="12"/></svg>
        ),
        CheckCircle2: ({ className = 'w-4 h-4' }) => (
          <svg className={className} fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></svg>
        ),
        X: ({ className = 'w-4 h-4' }) => (
          <svg className={className} fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
        ),
        Clock: ({ className = 'w-4 h-4' }) => (
          <svg className={className} fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        ),
        ChevronDown: ({ className = 'w-4 h-4' }) => (
          <svg className={className} fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg>
        ),
        ChevronUp: ({ className = 'w-4 h-4' }) => (
          <svg className={className} fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24"><path d="m18 15-6-6-6 6"/></svg>
        ),
      };

      // --- COMPONENTE ATÓMICO: PLACA PATENTE (UnitLicensePlate) ---
      function UnitLicensePlate({ plate, label, size = 'sm' }) {
        const hasPlate = Boolean(plate && plate.trim() !== '');
        const formatted = hasPlate ? formatPlateDisplay(plate) : '---';
        const widthClass = size === 'sm' ? 'w-[102px]' : 'w-[116px]';
        const textClass = size === 'sm' ? 'text-[11px] py-0.5' : 'text-[13px] py-1';

        return (
          <div className={`flex flex-col items-center ${widthClass}`} title={`${label}: ${formatted}`}>
            <div className="w-full bg-white border-[1.5px] border-zinc-800 rounded-[5px] overflow-hidden shadow-xs">
              <div className="w-full h-[5px] bg-[#0046B8]" />
              <div
                className={`w-full text-center px-1 leading-tight font-extrabold tracking-tight whitespace-nowrap font-mono ${textClass} ${
                  hasPlate ? 'text-zinc-950' : 'text-zinc-400'
                }`}
              >
                {formatted}
              </div>
            </div>
          </div>
        );
      }

      // --- AUTH HEADERS COORDINACIÓN (base.user_coordinacion) ---
      function getCoordinacionAuthHeaders() {
        const headers = { 'Content-Type': 'application/json', 'x-origen': 'coordinacion' };
        try {
          const raw = localStorage.getItem('base_coordinacion_user');
          if (raw) {
            const parsed = JSON.parse(raw);
            if (parsed && parsed.id) {
              headers['x-coordinacion-user-id'] = parsed.id;
              headers['x-user-id'] = parsed.id;
            }
          }
        } catch (err) {}
        return headers;
      }

      // --- CARD KANBAN COORDINACIÓN (UnitPlaneacionCard) ---
      function UnitPlaneacionCard({ card, onClick, onNoteAdded }) {
        const [noteText, setNoteText] = useState('');
        const [submitting, setSubmitting] = useState(false);
        const [isActive, setIsActive] = useState(false);
        const cardRef = useRef(null);
        const inputRef = useRef(null);

        const isPreasignadoHold = Boolean(card.hold_id || card.etapa_ciclo === 'PLANIFICADO_HOLD');
        const isUnfinalizedPreasignado = isPreasignadoHold && Boolean(card.en_proceso_activo);
        const lastZone = isPreasignadoHold
          ? (card.ubicacion_actual_zone || card.salida_origen_zone || '')
          : '';
        const lastBox = isPreasignadoHold
          ? (card.ubicacion_actual_box ||
             card.salida_origen_box ||
             (card.box_name && card.box_name !== 'Sin Box' ? card.box_name : ''))
          : (card.box_name || '');

        const latestNote = card.notes && card.notes.length > 0 ? card.notes[card.notes.length - 1] : null;
        const isCoordNote = latestNote
          ? (!latestNote.usuario_id || latestNote.location === 'Coordinación' || latestNote.usuario === null)
          : false;
        const previewNote = latestNote?.texto || card.ultima_tarea || null;
        const previewLocation = latestNote
          ? (latestNote.location || (isCoordNote ? 'Coordinación' : (card.salida_origen_box || card.box_name || 'Box')))
          : (card.salida_origen_box || card.box_name || 'Box');
        const previewAuthor = isCoordNote
          ? null
          : (latestNote?.usuario || card.ultima_tarea_usuario || (card.usuarios_nombres && card.usuarios_nombres[0]) || 'Mecánico');
        const previewTimestamp = latestNote?.timestamp || card.ultima_tarea_at || null;

        // Cierra el input al hacer clic fuera de la tarjeta (siempre que no tenga texto escrito)
        useEffect(() => {
          if (!isActive) return;
          const handleDocClick = (e) => {
            if (cardRef.current && !cardRef.current.contains(e.target)) {
              if (!noteText.trim()) {
                setIsActive(false);
              }
            }
          };
          document.addEventListener('click', handleDocClick);
          return () => document.removeEventListener('click', handleDocClick);
        }, [isActive, noteText]);

        const handleKeyDownNote = async (e) => {
          e.stopPropagation();
          if (e.key === 'Escape') {
            e.preventDefault();
            if (!noteText.trim()) {
              setIsActive(false);
              inputRef.current?.blur();
            }
            return;
          }
          if (e.key === 'Enter') {
            e.preventDefault();
            const trimmed = noteText.trim();
            if (!trimmed || submitting) return;
            setSubmitting(true);
            try {
              const res = isPreasignadoHold
                ? await fetch(`${API_BASE}/api/planeacion/holds/${card.hold_id || card.proceso_id}`, {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ notaPlanificacion: trimmed }),
                  })
                : await fetch(`${API_BASE}/api/planeacion/procesos/${card.proceso_id}/notas`, {
                    method: 'POST',
                    headers: {
                      'Content-Type': 'application/json',
                      'x-origen': 'coordinacion',
                    },
                    body: JSON.stringify({
                      texto: trimmed,
                      usuarioId: null,
                      usuario: null,
                      location: 'Coordinación',
                    }),
                  });
              if (res.ok) {
                setNoteText('');
                setIsActive(false);
                inputRef.current?.blur();
                onNoteAdded && onNoteAdded();
              }
            } catch (err) {
              console.error(err);
            } finally {
              setSubmitting(false);
            }
          }
        };

        const handleCardDragStart = (e) => {
          e.stopPropagation();
          const payloadObj = {
            type: card.hold_id ? 'CARD_HOLD' : 'CARD_PROCESO',
            procesoId: card.proceso_id,
            holdId: card.hold_id || null,
            unidadId: card.unidad_id || null,
            tractorId: card.tractor_id || null,
            semiId: card.semi_id || null,
            nUte: card.n_ute || '',
            tractorPlate: card.tractor_plate || '',
            semiPlate: card.semi_plate || '',
            plate: card.tractor_plate || card.semi_plate || card.n_ute || 'Unidad',
            boxId: card.box_id,
            boxName: card.box_name,
            zoneId: card.zone_id,
            zoneName: card.zone_name,
            salidaAt: card.salida_at,
            inicioAt: card.inicio_at,
            llegadaAt: card.llegada_at,
          };
          window.__COORD_DRAG_PAYLOAD = payloadObj;
          const jsonStr = JSON.stringify(payloadObj);
          try {
            e.dataTransfer.setData('application/json', jsonStr);
            e.dataTransfer.setData('text/plain', jsonStr);
            e.dataTransfer.effectAllowed = 'move';
          } catch (err) {}
        };

        const handleCardDragEnd = () => {
          window.__COORD_DRAG_PAYLOAD = null;
        };

        const handleCardClick = (e) => {
          onClick && onClick(card);
          setIsActive(true);
        };

        const isInputAlwaysVisible = isActive || Boolean(noteText.trim()) || submitting;

        return (
          <div
            ref={cardRef}
            draggable
            onDragStart={handleCardDragStart}
            onDragEnd={handleCardDragEnd}
            onClick={handleCardClick}
            className={`group rounded-[6px] transform transition-all duration-200 ease-out hover:-translate-y-0.5 active:scale-[0.985] p-2.5 cursor-grab active:cursor-grabbing select-none flex items-start justify-between gap-2.5 ${
              isUnfinalizedPreasignado
                ? 'bg-[#FDE68A] border-none shadow-[0_1px_3px_rgba(0,0,0,0.08),0_1px_2px_rgba(0,0,0,0.04)] hover:bg-[#FCD34D] hover:shadow-md'
                : 'bg-white border border-zinc-300/90 shadow-[0_1px_3px_rgba(0,0,0,0.06),0_1px_2px_rgba(0,0,0,0.04)] hover:shadow-md hover:border-zinc-500'
            }`}
          >
            {/* Par de chapas patentes */}
            <div className="flex flex-col gap-1.5 shrink-0">
              {card.tractor_plate && <UnitLicensePlate plate={card.tractor_plate} label="Tractor" size="sm" />}
              {card.semi_plate && <UnitLicensePlate plate={card.semi_plate} label="Semi" size="sm" />}
              {!card.tractor_plate && !card.semi_plate && (
                <span className="font-mono text-xs font-bold text-zinc-900">UTE {card.n_ute || 'S/N'}</span>
              )}
            </div>

            {/* Columna Derecha */}
            <div className="flex flex-col justify-start items-start min-w-0 flex-1 self-stretch py-0.5 gap-1.5">
              <div
                className="flex items-center justify-between gap-1.5 text-[12px] leading-tight text-zinc-950 font-extrabold w-full"
                title={
                  isPreasignadoHold
                    ? (lastZone && lastBox
                        ? `Última ubicación: ${lastZone} · ${lastBox}`
                        : lastBox
                        ? `Última ubicación: ${lastBox}`
                        : 'Sin Box (Preasignado)')
                    : (card.box_name ? `Box actual: ${card.box_name}` : 'Sin Box')
                }
              >
                <div className="flex items-center gap-1.5 min-w-0">
                  <Icons.MapPin
                    className={`w-3.5 h-3.5 shrink-0 ${
                      isUnfinalizedPreasignado
                        ? 'text-[#78350F]'
                        : (lastBox || card.box_name ? 'text-zinc-900' : 'text-zinc-400')
                    }`}
                  />
                  {isPreasignadoHold ? (
                    lastZone && lastBox ? (
                      <span className="truncate">
                        <span className={`uppercase font-mono text-[10px] font-bold tracking-tight ${isUnfinalizedPreasignado ? 'text-[#78350F]' : 'text-zinc-500'}`}>
                          {lastZone}
                        </span>
                        <span className={`mx-1 ${isUnfinalizedPreasignado ? 'text-[#78350F]/70' : 'text-zinc-400'}`}>·</span>
                        <span className={isUnfinalizedPreasignado ? 'text-zinc-950 font-extrabold' : 'text-zinc-900 font-extrabold'}>
                          {lastBox}
                        </span>
                      </span>
                    ) : lastBox ? (
                      <span className="truncate">{lastBox}</span>
                    ) : (
                      <span className={`truncate font-normal italic ${isUnfinalizedPreasignado ? 'text-zinc-800' : 'text-zinc-400'}`}>
                        Sin Box
                      </span>
                    )
                  ) : (
                    card.box_name && card.box_name !== 'Sin Box' ? (
                      <span className="truncate">{card.box_name}</span>
                    ) : (
                      <span className="truncate font-normal italic text-zinc-400">Sin Box</span>
                    )
                  )}
                </div>
                {card.salida_at ? (
                  <span className="text-[10px] font-mono text-zinc-500 font-bold shrink-0" title={`Salida: ${card.salida_at}`}>
                    {formatDateTimeShort(card.salida_at)}
                  </span>
                ) : card.inicio_at ? (
                  <span className="text-[10px] font-mono text-emerald-700 font-bold shrink-0" title={`Inicio: ${card.inicio_at}`}>
                    {formatDateTimeShort(card.inicio_at)}
                  </span>
                ) : (
                  card.llegada_at ? (
                    <span className={`text-[10px] font-mono font-bold tabular-nums shrink-0 ${isUnfinalizedPreasignado ? 'text-zinc-900' : 'text-amber-800'}`} title={`Preasignado / En espera: ${card.llegada_at}`}>
                      {formatDateTimeShort(card.llegada_at)}
                    </span>
                  ) : null
                )}
              </div>

              {previewNote && (
                <div className={`w-full space-y-0.5 pt-1 ${isUnfinalizedPreasignado ? 'border-t border-amber-300/80' : 'border-t border-zinc-200/80'}`}>
                  <div className="flex items-center justify-between gap-2 text-[10px] leading-tight">
                    <div className="flex items-center gap-1.5 min-w-0">
                      <span className={`font-bold tracking-wide shrink-0 ${isUnfinalizedPreasignado ? 'text-[#78350F]' : 'text-[#F59E0B]'}`}>{previewLocation}</span>
                      {previewAuthor && (
                        <span className={`inline-flex items-center gap-1 font-roboto text-[10px] truncate ${isUnfinalizedPreasignado ? 'text-zinc-900 font-medium' : 'font-thin text-zinc-600'}`}>
                          <Icons.User className={`w-3 h-3 shrink-0 ${isUnfinalizedPreasignado ? 'text-[#1E40AF]' : 'text-zinc-500'}`} />
                          <span className="truncate">{previewAuthor}</span>
                        </span>
                      )}
                    </div>
                    {previewTimestamp && (
                      <span className={`text-[9px] tabular-nums shrink-0 text-right ${isUnfinalizedPreasignado ? 'text-zinc-800/90 font-medium' : 'font-thin text-zinc-500'}`}>
                        {formatDateTimeShort(previewTimestamp)}
                      </span>
                    )}
                  </div>
                  <p className={`font-notes text-[11px] leading-snug line-clamp-2 ${isUnfinalizedPreasignado ? 'text-zinc-900 font-medium' : 'text-zinc-700'}`}>{previewNote}</p>
                </div>
              )}

              {/* Stroke input al fondo: solo visible en hover / onclick */}
              <div
                className={`w-full mt-auto pt-1 transition-opacity duration-150 ${
                  isInputAlwaysVisible
                    ? 'opacity-100 pointer-events-auto'
                    : 'opacity-0 pointer-events-none group-hover:opacity-100 group-hover:pointer-events-auto'
                }`}
                onClick={(e) => {
                  e.stopPropagation();
                  setIsActive(true);
                  inputRef.current?.focus();
                }}
              >
                <div className="relative flex items-center w-full">
                  <input
                    ref={inputRef}
                    type="text"
                    draggable={false}
                    onDragStart={(e) => {
                      e.preventDefault();
                      e.stopPropagation();
                    }}
                    value={noteText}
                    disabled={submitting}
                    onChange={(e) => setNoteText(e.target.value)}
                    onKeyDown={handleKeyDownNote}
                    onFocus={() => setIsActive(true)}
                    onBlur={() => {
                      if (!noteText.trim()) setIsActive(false);
                    }}
                    placeholder="+ Nota..."
                    className={`w-full bg-transparent border-0 border-b ${
                      isUnfinalizedPreasignado
                        ? 'border-amber-400/80 hover:border-amber-600 focus:border-zinc-950 text-zinc-900 placeholder:text-zinc-700/60'
                        : 'border-zinc-200/90 hover:border-zinc-400 focus:border-zinc-950 text-zinc-800 placeholder:text-zinc-400/80'
                    } text-[11px] placeholder:italic pb-0.5 outline-none transition-colors`}
                  />
                  {submitting && (
                    <span className="absolute right-0 text-[9px] font-mono text-zinc-400 animate-pulse">
                      ...
                    </span>
                  )}
                </div>
              </div>
            </div>
          </div>
        );
      }

      // --- MODAL NUEVO INGRESO A BOX ---
      function ModalNuevoIngreso({ open, catalog, onClose, onCreated }) {
        const [search, setSearch] = useState('');
        const [selectedUnitId, setSelectedUnitId] = useState('');
        const [selectedBoxId, setSelectedBoxId] = useState('');
        const [notaTexto, setNotaTexto] = useState('');
        const [saving, setSaving] = useState(false);

        useEffect(() => {
          if (catalog && catalog.boxes && catalog.boxes.length > 0 && !selectedBoxId) {
            setSelectedBoxId(catalog.boxes[0].id);
          }
        }, [catalog, selectedBoxId]);

        const filteredUnits = useMemo(() => {
          const q = search.trim().toLowerCase();
          const list = (catalog && catalog.unidades) || [];
          if (!q) return list.slice(0, 30);
          return list
            .filter((u) => (u.n_ute && u.n_ute.toLowerCase().includes(q)) || (u.tractor_plate && u.tractor_plate.toLowerCase().includes(q)) || (u.semi_plate && u.semi_plate.toLowerCase().includes(q)))
            .slice(0, 30);
        }, [catalog, search]);

        if (!open) return null;

        const handleSubmit = async (e) => {
          e.preventDefault();
          const boxId = selectedBoxId || catalog.boxes?.[0]?.id;
          if (!selectedUnitId || !boxId) return;

          setSaving(true);
          try {
            const res = await fetch(`${API_BASE}/api/planeacion/procesos/llegada`, {
              method: 'POST',
              headers: getCoordinacionAuthHeaders(),
              body: JSON.stringify({
                unidadId: selectedUnitId,
                boxId,
                notaTexto: notaTexto.trim() || null,
              }),
            });
            const data = await res.json();
            if (!res.ok) throw new Error(data.error || 'Error registrando llegada a box');
            onCreated();
            onClose();
          } catch (err) {
            console.error('Error registrando llegada a box:', err);
          } finally {
            setSaving(false);
          }
        };

        return (
          <div className="fixed inset-0 z-50 bg-black/50 backdrop-blur-[2px] flex items-center justify-center p-4" onClick={onClose}>
            <form onSubmit={handleSubmit} onClick={(e) => e.stopPropagation()} className="bg-white border border-zinc-300 rounded-xl w-full max-w-md p-5 shadow-2xl flex flex-col gap-4 text-zinc-950">
              <div className="flex items-center justify-between border-b border-zinc-200 pb-3">
                <div className="flex items-center gap-2">
                  <div className="w-8 h-8 rounded-lg bg-emerald-100 text-emerald-800 flex items-center justify-center font-bold">
                    <Icons.Truck className="w-4 h-4" />
                  </div>
                  <div>
                    <h3 className="text-sm font-black uppercase tracking-wide">Registrar Llegada a Box</h3>
                    <p className="text-[11px] text-zinc-500">Asigna la unidad directamente a un box de taller</p>
                  </div>
                </div>
                <button type="button" onClick={onClose} className="w-7 h-7 rounded-md hover:bg-zinc-100 flex items-center justify-center text-zinc-500 hover:text-zinc-950">
                  <Icons.X className="w-4 h-4" />
                </button>
              </div>

              <div className="flex flex-col gap-1.5">
                <label className="text-[11px] font-bold uppercase text-zinc-700">Buscar Unidad (UTE o Patente)</label>
                <input
                  type="text"
                  value={search}
                  onChange={(e) => setSearch(e.target.value)}
                  placeholder="Escribí UTE o patente..."
                  className="px-3 py-1.5 text-xs border border-zinc-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-zinc-950"
                />
                <select
                  value={selectedUnitId}
                  onChange={(e) => setSelectedUnitId(e.target.value)}
                  className="px-3 py-2 text-xs font-semibold border border-zinc-300 rounded-lg bg-white"
                  size={4}
                >
                  {filteredUnits.map((u) => (
                    <option key={u.unidad_id} value={u.unidad_id}>
                      UTE {u.n_ute || '---'} | TR: {u.tractor_plate || '---'} | SM: {u.semi_plate || '---'}
                    </option>
                  ))}
                </select>
              </div>

              <div className="flex flex-col gap-1.5">
                <label className="text-[11px] font-bold uppercase text-zinc-700">Box de Destino</label>
                <select
                  value={selectedBoxId}
                  onChange={(e) => setSelectedBoxId(e.target.value)}
                  className="px-3 py-2 text-xs font-semibold border border-zinc-300 rounded-lg bg-white"
                >
                  {(catalog.boxes || []).map((b) => (
                    <option key={b.id} value={b.id}>
                      Box {b.box_name} ({b.zone_name})
                    </option>
                  ))}
                </select>
              </div>

              <div className="flex flex-col gap-1.5">
                <label className="text-[11px] font-bold uppercase text-zinc-700">Nota Inicial (Opcional)</label>
                <input
                  type="text"
                  value={notaTexto}
                  onChange={(e) => setNotaTexto(e.target.value)}
                  placeholder="Observaciones de ingreso..."
                  className="px-3 py-1.5 text-xs border border-zinc-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-zinc-950"
                />
              </div>

              <div className="flex items-center justify-end gap-2 pt-2 border-t border-zinc-200">
                <button
                  type="button"
                  onClick={onClose}
                  className="px-3 py-1.5 text-xs font-bold text-zinc-600 hover:text-zinc-950 hover:bg-zinc-100 rounded-lg"
                >
                  Cancelar
                </button>
                <button
                  type="submit"
                  disabled={saving || !selectedUnitId}
                  className="px-4 py-1.5 text-xs font-bold text-white bg-emerald-600 hover:bg-emerald-700 rounded-lg shadow-xs disabled:opacity-50 flex items-center gap-1.5"
                >
                  {saving && <Icons.Refresh className="w-3.5 h-3.5 animate-spin" />}
                  <span>Registrar Llegada</span>
                </button>
              </div>
            </form>
          </div>
        );
      }

      // --- COMPONENTE PRINCIPAL APP ---
      function CoordinacionApp() {
        const [board, setBoard] = useState({ activos: [], holds: [], catalog: { zones: [], boxes: [], unidades: [] } });
        const [search, setSearch] = useState('');
        const [sortDesc, setSortDesc] = useState(true);
        const [loading, setLoading] = useState(true);
        const [fetching, setFetching] = useState(false);
        const [isNewIngresoOpen, setIsNewIngresoOpen] = useState(false);
        const [dragOverZoneId, setDragOverZoneId] = useState(null);
        const [dragOverPreasignadoZoneId, setDragOverPreasignadoZoneId] = useState(null);
        const [dragOverEgreso, setDragOverEgreso] = useState(false);
        const [selectedCard, setSelectedCard] = useState(null);
        const fetchSeqRef = useRef(0);
        const socketDebounceRef = useRef(null);

        const activosCount = (board.activos || []).length;

        const fetchBoard = useCallback(async () => {
          const seq = ++fetchSeqRef.current;
          setFetching(true);
          try {
            const res = await fetch(`${API_BASE}/api/planeacion/board?includeCatalog=1`);
            if (res.ok) {
              const data = await res.json();
              if (seq === fetchSeqRef.current) {
                setBoard(data);
              }
            }
          } catch (err) {
            console.error('Error cargando board:', err);
          } finally {
            if (seq === fetchSeqRef.current) {
              setLoading(false);
              setFetching(false);
            }
          }
        }, []);

        const scheduleFetchBoard = useCallback(() => {
          if (socketDebounceRef.current) clearTimeout(socketDebounceRef.current);
          socketDebounceRef.current = setTimeout(() => {
            fetchBoard();
          }, 80);
        }, [fetchBoard]);

        useEffect(() => {
          fetchBoard();

          // Socket.IO sync (coalesce para evitar blink por doble refresco simultáneo)
          let socket;
          try {
            socket = io(API_BASE, { transports: ['websocket', 'polling'] });
            socket.on('planeacion_board_updated', () => {
              scheduleFetchBoard();
            });
          } catch (e) {
            console.warn('Socket no conectado:', e);
          }

          return () => {
            if (socketDebounceRef.current) clearTimeout(socketDebounceRef.current);
            if (socket) socket.disconnect();
          };
        }, [fetchBoard, scheduleFetchBoard]);

        // Filtrado y agrupado de columnas según base.zones
        const columns = useMemo(() => {
          const q = search.trim().toLowerCase();
          const activosList = board.activos || [];
          const holdCards = (board.holds || []).map((h) => {
            const activeUnfinalized = activosList.find(
              (a) =>
                !a.salida_at &&
                ((h.unidad_id && a.unidad_id === h.unidad_id) ||
                  (h.tractor_id && a.tractor_id === h.tractor_id) ||
                  (h.semi_id && a.semi_id === h.semi_id))
            );
            const ubicacionBox =
              h.ubicacion_actual_box || activeUnfinalized?.box_name || h.salida_origen_box || null;
            const ubicacionZone =
              h.ubicacion_actual_zone || activeUnfinalized?.zone_name || h.salida_origen_zone || null;

            return {
              proceso_id: h.hold_id,
              hold_id: h.hold_id,
              unidad_id: h.unidad_id,
              n_ute: h.n_ute || '',
              tractor_id: h.tractor_id,
              tractor_plate: h.tractor_plate || '',
              semi_id: h.semi_id,
              semi_plate: h.semi_plate || '',
              box_id: h.box_id || '',
              box_name: h.box_name || '',
              zone_id: h.zone_id,
              zone_name: h.zone_name,
              estado_proceso: 'PREASIGNADO',
              etapa_ciclo: 'PLANIFICADO_HOLD',
              llegada_at: '',
              inicio_at: null,
              salida_at: null,
              usuarios_ids: h.usuarios_ids || [],
              usuarios_nombres: h.usuarios_nombres || [],
              notes:
                h.notes && h.notes.length > 0
                  ? h.notes
                  : h.nota_planificacion
                  ? [{ texto: h.nota_planificacion, location: 'Coordinación', timestamp: h.created_at }]
                  : [],
              salida_previa_at: h.salida_previa_at || null,
              salida_origen_box: ubicacionBox,
              salida_origen_zone: ubicacionZone,
              ultima_tarea: h.ultima_tarea || null,
              ultima_tarea_usuario: h.ultima_tarea_usuario || null,
              ultima_tarea_at: h.ultima_tarea_at || null,
              en_proceso_activo: Boolean(h.en_proceso_activo ?? activeUnfinalized),
              ubicacion_actual_box: ubicacionBox,
              ubicacion_actual_zone: ubicacionZone,
            };
          });

          const allCards = [...activosList, ...holdCards];
          const filtered = allCards.filter((c) => {
            if (!q) return true;
            return (
              (c.tractor_plate && c.tractor_plate.toLowerCase().includes(q)) ||
              (c.semi_plate && c.semi_plate.toLowerCase().includes(q)) ||
              (c.box_name && c.box_name.toLowerCase().includes(q)) ||
              (c.zone_name && c.zone_name.toLowerCase().includes(q)) ||
              (c.n_ute && c.n_ute.toLowerCase().includes(q))
            );
          });

          const zoneMap = new Map();
          for (const z of (board.catalog?.zones || [])) {
            zoneMap.set(z.id, { id: z.id, title: z.zone_name, cards: [] });
          }

          for (const card of filtered) {
            if (!zoneMap.has(card.zone_id)) {
              zoneMap.set(card.zone_id, { id: card.zone_id, title: card.zone_name, cards: [] });
            }
            zoneMap.get(card.zone_id).cards.push(card);
          }

          const cols = Array.from(zoneMap.values());
          for (const col of cols) {
            col.cards.sort((a, b) => {
              const tA = new Date(a.salida_at || a.inicio_at || a.llegada_at || 0).getTime();
              const tB = new Date(b.salida_at || b.inicio_at || b.llegada_at || 0).getTime();
              return sortDesc ? tB - tA : tA - tB;
            });
          }
          return cols;
        }, [board.activos, board.holds, board.catalog?.zones, search, sortDesc]);

        const extractDragPayload = (e) => {
          try {
            const raw =
              (e.dataTransfer &&
                (e.dataTransfer.getData('application/json') ||
                  e.dataTransfer.getData('text/plain'))) ||
              '';
            if (raw) return JSON.parse(raw);
          } catch (err) {}
          return window.__COORD_DRAG_PAYLOAD || null;
        };

        const handleDropOnZone = async (zoneId, e, isPreasignadoSection = false) => {
          e.preventDefault();
          setDragOverZoneId(null);
          setDragOverPreasignadoZoneId(null);
          try {
            const data = extractDragPayload(e);
            window.__COORD_DRAG_PAYLOAD = null;
            if (!data) return;

            // Multi-PREASIGNADO: arrastrar un PREASIGNADO a otra zona desprende una nueva card PREASIGNADO sin ocultar el origen ni otras zonas (0 blink)
            if (data.type === 'CARD_HOLD' && data.holdId) {
              if (data.zoneId === zoneId) return;
              ++fetchSeqRef.current;
              setBoard((prev) => {
                const targetZone = (prev.catalog?.zones || []).find((z) => z.id === zoneId);
                const sourceHold = (prev.holds || []).find((h) => h.hold_id === data.holdId);
                const nowIso = new Date().toISOString();
                const optimisticHold = {
                  ...(sourceHold || {}),
                  hold_id: `temp_hold_${data.holdId}_${zoneId}`,
                  unidad_id: data.unidadId || sourceHold?.unidad_id || null,
                  n_ute: data.nUte || sourceHold?.n_ute || '',
                  tractor_id: data.tractorId || sourceHold?.tractor_id || null,
                  tractor_plate: data.tractorPlate || sourceHold?.tractor_plate || '',
                  semi_id: data.semiId || sourceHold?.semi_id || null,
                  semi_plate: data.semiPlate || sourceHold?.semi_plate || '',
                  zone_id: zoneId,
                  zone_name: targetZone?.zone_name || '',
                  box_id: null,
                  box_name: '',
                  notes: sourceHold?.notes || [],
                  created_at: nowIso,
                  updated_at: nowIso,
                };
                const remainingHolds = (prev.holds || []).filter(
                  (h) =>
                    !(
                      h.zone_id === zoneId &&
                      ((optimisticHold.unidad_id && h.unidad_id === optimisticHold.unidad_id) ||
                        (optimisticHold.tractor_id && h.tractor_id === optimisticHold.tractor_id) ||
                        (optimisticHold.semi_id && h.semi_id === optimisticHold.semi_id))
                    )
                );
                return {
                  ...prev,
                  holds: [optimisticHold, ...remainingHolds],
                };
              });

              const res = await fetch(`${API_BASE}/api/planeacion/holds`, {
                method: 'POST',
                headers: getCoordinacionAuthHeaders(),
                body: JSON.stringify({
                  zoneId,
                  boxId: null,
                  unidadId: data.unidadId || null,
                  tractorId: data.tractorId || null,
                  semiId: data.semiId || null,
                  procesoOrigenId: data.holdId,
                }),
              });
              if (!res.ok) throw new Error('Error al desprender preasignación');
              scheduleFetchBoard();
              return;
            }

            if (data.type === 'CARD_PROCESO' && data.procesoId) {
              // Caso 1 · Desde FINALIZÓ: sale de su columna del Kanban y pasa a la nueva en PREASIGNADO (conservando otras zonas sin blink)
              if (data.salidaAt) {
                ++fetchSeqRef.current;
                setBoard((prev) => {
                  const targetZone = (prev.catalog?.zones || []).find((z) => z.id === zoneId);
                  const sourceCard = (prev.activos || []).find((a) => a.proceso_id === data.procesoId);
                  const nowIso = new Date().toISOString();
                  const optimisticHold = {
                    hold_id: `temp_hold_${data.procesoId}_${zoneId}`,
                    unidad_id: data.unidadId || sourceCard?.unidad_id || null,
                    n_ute: data.nUte || sourceCard?.n_ute || '',
                    tractor_id: data.tractorId || sourceCard?.tractor_id || null,
                    tractor_plate: data.tractorPlate || sourceCard?.tractor_plate || '',
                    semi_id: data.semiId || sourceCard?.semi_id || null,
                    semi_plate: data.semiPlate || sourceCard?.semi_plate || '',
                    zone_id: zoneId,
                    zone_name: targetZone?.zone_name || data.zoneName || '',
                    box_id: null,
                    box_name: '',
                    orden: 1,
                    usuarios_ids: [],
                    usuarios_nombres: [],
                    nota_planificacion: null,
                    notes: sourceCard?.notes || [],
                    created_at: nowIso,
                    updated_at: nowIso,
                    salida_previa_at: data.salidaAt || nowIso,
                    salida_origen_box: data.boxName || sourceCard?.box_name || null,
                    salida_origen_zone: data.zoneName || sourceCard?.zone_name || null,
                    en_proceso_activo: false,
                    ubicacion_actual_box: data.boxName || sourceCard?.box_name || null,
                    ubicacion_actual_zone: data.zoneName || sourceCard?.zone_name || null,
                  };
                  const remainingHolds = (prev.holds || []).filter(
                    (h) =>
                      !(
                        h.zone_id === zoneId &&
                        ((optimisticHold.unidad_id && h.unidad_id === optimisticHold.unidad_id) ||
                          (optimisticHold.tractor_id && h.tractor_id === optimisticHold.tractor_id) ||
                          (optimisticHold.semi_id && h.semi_id === optimisticHold.semi_id))
                      )
                  );
                  return {
                    ...prev,
                    activos: (prev.activos || []).filter((a) => a.proceso_id !== data.procesoId),
                    holds: [optimisticHold, ...remainingHolds],
                  };
                });

                const res = await fetch(`${API_BASE}/api/planeacion/procesos/${data.procesoId}`, {
                  method: 'PATCH',
                  headers: getCoordinacionAuthHeaders(),
                  body: JSON.stringify({
                    zoneId,
                    action: 'REINTEGRAR_A_PREASIGNADO',
                  }),
                });
                if (!res.ok) throw new Error('Error al trasladar unidad desde Finalizó a Preasignado');
                scheduleFetchBoard();
                return;
              }

              // Caso 2A · Desde otra instancia (TRABAJANDO / ESPERANDO A SER INGRESADO A BOX) soltada en PREASIGNADO de su MISMA zona: revertir a hold
              if (data.zoneId === zoneId) {
                if (!isPreasignadoSection) return;
                const res = await fetch(`${API_BASE}/api/planeacion/procesos/${data.procesoId}`, {
                  method: 'PATCH',
                  headers: getCoordinacionAuthHeaders(),
                  body: JSON.stringify({
                    action: 'REVERTIR_A_HOLD',
                  }),
                });
                if (!res.ok) throw new Error('Error al revertir unidad a preasignado');
                scheduleFetchBoard();
                return;
              }

              // Caso 2B · Desde otra instancia (TRABAJANDO / ESPERANDO A SER INGRESADO A BOX) hacia OTRA zona: mantiene carta activa y desprende PREASIGNADO amarillo (0 blink)
              ++fetchSeqRef.current;
              setBoard((prev) => {
                const targetZone = (prev.catalog?.zones || []).find((z) => z.id === zoneId);
                const sourceCard = (prev.activos || []).find((a) => a.proceso_id === data.procesoId);
                const nowIso = new Date().toISOString();
                const optimisticHold = {
                  hold_id: `temp_hold_${data.procesoId}_${zoneId}`,
                  unidad_id: data.unidadId || sourceCard?.unidad_id || null,
                  n_ute: data.nUte || sourceCard?.n_ute || '',
                  tractor_id: data.tractorId || sourceCard?.tractor_id || null,
                  tractor_plate: data.tractorPlate || sourceCard?.tractor_plate || '',
                  semi_id: data.semiId || sourceCard?.semi_id || null,
                  semi_plate: data.semiPlate || sourceCard?.semi_plate || '',
                  zone_id: zoneId,
                  zone_name: targetZone?.zone_name || '',
                  box_id: null,
                  box_name: '',
                  orden: 1,
                  usuarios_ids: [],
                  usuarios_nombres: [],
                  nota_planificacion: null,
                  notes: sourceCard?.notes || [],
                  created_at: nowIso,
                  updated_at: nowIso,
                  salida_previa_at: null,
                  salida_origen_box: data.boxName || sourceCard?.box_name || null,
                  salida_origen_zone: data.zoneName || sourceCard?.zone_name || null,
                  en_proceso_activo: true,
                  ubicacion_actual_box: data.boxName || sourceCard?.box_name || null,
                  ubicacion_actual_zone: data.zoneName || sourceCard?.zone_name || null,
                };
                const remainingHolds = (prev.holds || []).filter(
                  (h) =>
                    !(
                      h.zone_id === zoneId &&
                      ((optimisticHold.unidad_id && h.unidad_id === optimisticHold.unidad_id) ||
                        (optimisticHold.tractor_id && h.tractor_id === optimisticHold.tractor_id) ||
                        (optimisticHold.semi_id && h.semi_id === optimisticHold.semi_id))
                    )
                );
                return {
                  ...prev,
                  holds: [optimisticHold, ...remainingHolds],
                };
              });

              const res = await fetch(`${API_BASE}/api/planeacion/holds`, {
                method: 'POST',
                headers: getCoordinacionAuthHeaders(),
                body: JSON.stringify({
                  zoneId,
                  boxId: null,
                  unidadId: data.unidadId || null,
                  tractorId: data.tractorId || null,
                  semiId: data.semiId || null,
                  procesoOrigenId: data.procesoId,
                }),
              });
              if (!res.ok) throw new Error('Error al preasignar unidad activa');
              scheduleFetchBoard();
              return;
            }
          } catch (err) {
            console.error('Error en drag & drop de zona:', err);
            fetchBoard();
          }
        };

        const handleDropOnPreasignado = async (zoneId, e) => {
          e.preventDefault();
          setDragOverPreasignadoZoneId(null);
          setDragOverZoneId(null);
          await handleDropOnZone(zoneId, e, true);
        };

        const handleDropOnEgreso = async (e) => {
          e.preventDefault();
          setDragOverEgreso(false);
          try {
            const data = extractDragPayload(e);
            window.__COORD_DRAG_PAYLOAD = null;
            if (!data) return;

            if (data.type === 'CARD_PROCESO' && data.procesoId) {
              ++fetchSeqRef.current;
              setBoard((prev) => ({
                ...prev,
                activos: (prev.activos || []).filter((a) => a.proceso_id !== data.procesoId),
              }));
              const res = await fetch(`${API_BASE}/api/planeacion/procesos/${data.procesoId}`, {
                method: 'PATCH',
                headers: getCoordinacionAuthHeaders(),
                body: JSON.stringify({ action: 'ARCHIVAR' }),
              });
              if (!res.ok) throw new Error('Error al finalizar proceso para egreso');
              scheduleFetchBoard();
              return;
            }

            if (data.type === 'CARD_HOLD' && data.holdId) {
              ++fetchSeqRef.current;
              setBoard((prev) => ({
                ...prev,
                holds: (prev.holds || []).filter((h) => h.hold_id !== data.holdId),
              }));
              const res = await fetch(`${API_BASE}/api/planeacion/holds/${data.holdId}`, {
                method: 'DELETE',
                headers: getCoordinacionAuthHeaders(),
              });
              if (!res.ok) throw new Error('Permiso denegado o error al eliminar preasignado');
              scheduleFetchBoard();
              return;
            }
          } catch (err) {
            console.error('Error en egreso:', err);
            fetchBoard();
          }
        };

        return (
          <div className="h-full w-full flex flex-col bg-[#EDEDED] text-zinc-950">

            {/* Header Coordinación · UI Design System compliant */}
            <header className="w-full px-4 md:px-6 py-2.5 flex items-center justify-between min-h-[48px] shrink-0 bg-[#EDEDED] border-b border-zinc-300/80">
              {/* Controles Izquierda: Buscador + Refresh + Contador */}
              <div className="flex items-center gap-2.5">
                <div className="relative">
                  <span className="absolute left-2.5 top-1/2 -translate-y-1/2 text-zinc-500 pointer-events-none">
                    <Icons.Search className="w-3.5 h-3.5" />
                  </span>
                  <input
                    type="text"
                    value={search}
                    onChange={(e) => setSearch(e.target.value)}
                    placeholder="Patente, box o zona..."
                    className="h-8 pl-8 pr-3 bg-white border border-zinc-300 rounded-full text-xs text-zinc-900 placeholder:text-zinc-500 focus:outline-none focus:ring-2 focus:ring-zinc-800 focus:ring-offset-1 w-56 md:w-64 transition-all shadow-2xs"
                  />
                </div>

                <button
                  type="button"
                  onClick={fetchBoard}
                  title="Actualizar tablero"
                  className="w-8 h-8 rounded-full bg-white border border-zinc-300 flex items-center justify-center text-zinc-700 hover:text-zinc-950 hover:border-zinc-500 transition-colors cursor-pointer shadow-2xs focus:outline-none focus:ring-2 focus:ring-zinc-800"
                >
                  <Icons.Refresh className={`w-3.5 h-3.5 ${fetching ? 'animate-spin' : ''}`} />
                </button>

                <span
                  className="hidden sm:inline-flex items-center text-[11px] font-mono font-bold px-2.5 py-1 rounded-full bg-white border border-zinc-300 text-zinc-700 shadow-2xs select-none"
                  title="Unidades activas en planta"
                >
                  {activosCount} activas
                </span>
              </div>

              {/* Controles Derecha: Primary CTA (+ Ingresar Unidad) + Sort + Status */}
              <div className="flex items-center gap-2">
                <button
                  type="button"
                  onClick={() => setIsNewIngresoOpen(true)}
                  className="h-8 inline-flex items-center gap-1.5 px-3 rounded-full bg-emerald-600 text-white text-xs font-bold hover:bg-emerald-700 shadow-xs transition-colors cursor-pointer focus:outline-none focus:ring-2 focus:ring-emerald-600 focus:ring-offset-2"
                >
                  <Icons.Plus className="w-3.5 h-3.5" />
                  <span>Ingresar Unidad</span>
                </button>

                <button
                  type="button"
                  onClick={() => setSortDesc((prev) => !prev)}
                  title={`Ordenar por llegada (${sortDesc ? 'Más reciente' : 'Más antiguo'})`}
                  className="w-8 h-8 rounded-full bg-white border border-zinc-300 hover:border-zinc-500 text-zinc-700 hover:text-zinc-950 flex items-center justify-center cursor-pointer shadow-2xs transition-colors focus:outline-none focus:ring-2 focus:ring-zinc-800"
                >
                  <Icons.ArrowUpDown className="w-3.5 h-3.5 text-zinc-900" />
                </button>

                <div
                  className="inline-flex items-center gap-1.5 h-8 px-2.5 rounded-full bg-white border border-zinc-300 text-[11px] font-mono font-bold text-zinc-800 shadow-2xs select-none"
                  title="Canal activo de coordinación"
                >
                  <span className="w-2 h-2 rounded-full bg-emerald-500 animate-pulse" />
                  <span>#coordinacion</span>
                </div>
              </div>
            </header>

            {/* Tablero Kanban */}
            <main className="flex-1 min-h-0 w-full px-3 md:px-6 py-2.5 flex flex-col overflow-x-auto overflow-y-hidden">
              {loading ? (
                <div className="flex-1 flex items-center justify-center text-zinc-600 gap-2">
                  <Icons.Refresh className="w-6 h-6 animate-spin text-zinc-900" />
                  <span className="text-xs font-bold">Cargando tablero de planeación...</span>
                </div>
              ) : (
                <div
                  className="grid flex-1 min-h-0 h-full gap-0 min-w-max"
                  style={{
                    gridTemplateColumns: `repeat(${columns.length}, minmax(260px, 1fr)) minmax(180px, 220px)`,
                  }}
                >
                  {columns.map((col) => {
                    const isDragOver = dragOverZoneId === col.id;
                    const salidaCards = col.cards.filter(
                      (c) => !c.hold_id && c.etapa_ciclo !== 'PLANIFICADO_HOLD' && Boolean(c.salida_at)
                    );
                    const inicioCards = col.cards.filter(
                      (c) => !c.hold_id && c.etapa_ciclo !== 'PLANIFICADO_HOLD' && Boolean(c.inicio_at && !c.salida_at)
                    );
                    const reservadoCards = col.cards.filter(
                      (c) => !c.hold_id && c.etapa_ciclo !== 'PLANIFICADO_HOLD' && Boolean(c.llegada_at && !c.inicio_at && !c.salida_at)
                    );
                    const preasignadoCards = col.cards.filter(
                      (c) => Boolean(c.hold_id || c.etapa_ciclo === 'PLANIFICADO_HOLD')
                    );

                    return (
                      <section
                        key={col.id}
                        onDragOver={(e) => {
                          e.preventDefault();
                          e.dataTransfer.dropEffect = 'move';
                          if (dragOverZoneId !== col.id) setDragOverZoneId(col.id);
                        }}
                        onDragLeave={(e) => {
                          if (!e.currentTarget.contains(e.relatedTarget)) {
                            if (dragOverZoneId === col.id) setDragOverZoneId(null);
                          }
                        }}
                        onDrop={(e) => handleDropOnZone(col.id, e, false)}
                        className={`h-full flex flex-col min-h-0 px-2.5 pt-1.5 pb-2 border-r-[3px] border-dashed border-amber-400 transition-colors ${
                          isDragOver ? 'bg-emerald-50/70 border-emerald-500' : ''
                        }`}
                      >
                        <div className="mb-2 px-1 flex items-center justify-between gap-2 h-[38px] shrink-0">
                          <h2 className="text-[15px] xl:text-[17px] font-extrabold tracking-tight text-zinc-950 lowercase font-mono truncate">
                            {col.title}
                          </h2>
                          <span className="text-xs font-mono font-bold text-zinc-700 bg-white border border-zinc-300 rounded-full px-2 py-0.5 shrink-0 shadow-2xs">
                            {col.cards.length}
                          </span>
                        </div>

                        <div className="flex-1 min-h-0 overflow-y-auto flex flex-col gap-2.5 pr-0.5 no-scrollbar">
                          {/* 1. TOPE: salida_at / FINALIZÓ */}
                          <div className="flex flex-col gap-2">
                            <div className="flex items-center justify-between px-1 text-[10px] font-mono font-bold tracking-wider uppercase text-zinc-950 opacity-40 select-none">
                              <span>FINALIZÓ</span>
                              <span className="tabular-nums font-semibold">{salidaCards.length}</span>
                            </div>
                            {salidaCards.length === 0 ? (
                              <div className="py-1 px-2 text-center text-[10px] font-mono text-zinc-400 opacity-40 italic select-none">
                                sin unidades
                              </div>
                            ) : (
                              salidaCards.map((card) => (
                                <UnitPlaneacionCard
                                  key={card.proceso_id}
                                  card={card}
                                  onClick={(c) => setSelectedCard(c)}
                                  onNoteAdded={fetchBoard}
                                />
                              ))
                            )}
                          </div>

                          {/* DIVIDER */}
                          <div className="border-t border-zinc-300 opacity-40 my-0.5" />

                          {/* 2. MEDIO: inicio_at / TRABAJANDO */}
                          <div className="flex flex-col gap-2">
                            <div className="flex items-center justify-between px-1 text-[10px] font-mono font-bold tracking-wider uppercase text-zinc-950 opacity-40 select-none">
                              <span>TRABAJANDO</span>
                              <span className="tabular-nums font-semibold">{inicioCards.length}</span>
                            </div>
                            {inicioCards.length === 0 ? (
                              <div className="py-1 px-2 text-center text-[10px] font-mono text-zinc-400 opacity-40 italic select-none">
                                sin unidades
                              </div>
                            ) : (
                              inicioCards.map((card) => (
                                <UnitPlaneacionCard
                                  key={card.proceso_id}
                                  card={card}
                                  onClick={(c) => setSelectedCard(c)}
                                  onNoteAdded={fetchBoard}
                                />
                              ))
                            )}
                          </div>

                          {/* DIVIDER */}
                          <div className="border-t border-zinc-300 opacity-40 my-0.5" />

                          {/* 3. SUBDIVIDER RESERVADO: procesos.llegada_at / ESPERANDO A SER INGRESADO A BOX */}
                          <div className="flex flex-col gap-2">
                            <div className="flex items-center justify-between gap-1 px-1 text-[10px] font-mono font-bold tracking-wider uppercase text-zinc-950 opacity-40 select-none">
                              <span className="truncate" title="Reservado (procesos.llegada_at) · Esperando a ser ingresado a Box">
                                ESPERANDO A SER INGRESADO A BOX
                              </span>
                              <span className="tabular-nums font-semibold shrink-0">{reservadoCards.length}</span>
                            </div>
                            {reservadoCards.length === 0 ? (
                              <div className="py-1 px-2 text-center text-[10px] font-mono text-zinc-400 opacity-40 italic select-none">
                                sin unidades
                              </div>
                            ) : (
                              reservadoCards.map((card) => (
                                <UnitPlaneacionCard
                                  key={card.proceso_id}
                                  card={card}
                                  onClick={(c) => setSelectedCard(c)}
                                  onNoteAdded={fetchBoard}
                                />
                              ))
                            )}
                          </div>

                          {/* DIVIDER */}
                          <div className="border-t border-zinc-300 opacity-40 my-0.5" />

                          {/* 4. FONDO: procesos_hold / PREASIGNADO */}
                          <div
                            onDragOver={(e) => {
                              e.preventDefault();
                              e.stopPropagation();
                              e.dataTransfer.dropEffect = 'move';
                              if (dragOverPreasignadoZoneId !== col.id) setDragOverPreasignadoZoneId(col.id);
                            }}
                            onDragLeave={(e) => {
                              e.stopPropagation();
                              if (!e.currentTarget.contains(e.relatedTarget)) {
                                if (dragOverPreasignadoZoneId === col.id) setDragOverPreasignadoZoneId(null);
                              }
                            }}
                            onDrop={(e) => {
                              e.stopPropagation();
                              handleDropOnPreasignado(col.id, e);
                            }}
                            className={`flex flex-col gap-2 p-1.5 rounded-lg transition-all ${
                              dragOverPreasignadoZoneId === col.id
                                ? 'bg-amber-100/70 border-2 border-dashed border-amber-500 ring-2 ring-amber-400/40'
                                : ''
                            }`}
                          >
                            <div className="flex items-center justify-between px-1 text-[10px] font-mono font-bold tracking-wider uppercase text-zinc-950 opacity-40 select-none">
                              <span>PREASIGNADO</span>
                              <span className="tabular-nums font-semibold">{preasignadoCards.length}</span>
                            </div>
                            {preasignadoCards.length === 0 ? (
                              <div className="py-1 px-2 text-center text-[10px] font-mono text-zinc-400 opacity-40 italic select-none">
                                sin unidades
                              </div>
                            ) : (
                              preasignadoCards.map((card) => (
                                <UnitPlaneacionCard
                                  key={card.proceso_id || card.hold_id}
                                  card={card}
                                  onClick={(c) => setSelectedCard(c)}
                                  onNoteAdded={fetchBoard}
                                />
                              ))
                            )}
                          </div>
                        </div>
                      </section>
                    );
                  })}

                  {/* Columna / Drop Zone para Dar Egreso */}
                  <section
                    onDragOver={(e) => {
                      e.preventDefault();
                      e.dataTransfer.dropEffect = 'move';
                      setDragOverEgreso(true);
                    }}
                    onDragLeave={() => setDragOverEgreso(false)}
                    onDrop={handleDropOnEgreso}
                    className={`h-full flex flex-col min-h-0 px-3 pt-2 pb-2 rounded-lg border-2 border-dashed transition-all ${
                      dragOverEgreso
                        ? 'border-rose-500 bg-rose-50 text-rose-950 scale-[1.01]'
                        : 'border-zinc-300/80 bg-zinc-200/50 text-zinc-600'
                    }`}
                  >
                    <div className="mb-2 px-1 flex items-center justify-between gap-2 h-[38px] shrink-0">
                      <div className="flex items-center gap-1.5 font-mono text-[13px] font-black uppercase text-zinc-800">
                        <Icons.LogOut className="w-4 h-4 text-zinc-600" />
                        <span>Egreso Planta</span>
                      </div>
                    </div>

                    <div className="flex-1 flex flex-col items-center justify-center p-4 text-center border border-zinc-300/60 rounded-lg bg-white/70">
                      <Icons.CheckCircle2 className="w-8 h-8 text-zinc-400 mb-2" />
                      <span className="text-xs font-bold text-zinc-800 uppercase tracking-wide">
                        Zona de Salida / Egreso
                      </span>
                      <p className="text-[11px] text-zinc-500 mt-1 leading-snug">
                        Arrastrá aquí una unidad para dar egreso definitivo de planta (archivado a procesos_cold).
                      </p>
                      <div className="mt-3 text-[10px] text-zinc-400 font-mono">
                        Liberación en PostgreSQL con salida_at
                      </div>
                    </div>
                  </section>
                </div>
              )}
            </main>

            {/* Modal Nuevo Ingreso */}
            <ModalNuevoIngreso open={isNewIngresoOpen} catalog={board.catalog} onClose={() => setIsNewIngresoOpen(false)} onCreated={fetchBoard} />
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById('root')).render(<CoordinacionApp />);
    </script>
  </body>
</html>
