services:
  # ==============================================================
  # 🚀 STATIC SERVICE EN RENDER (Frontend CDN - 100 GB/mes gratis)
  # Publica la carpeta ./public con cero consumo de RAM
  # ==============================================================
  - type: static
    name: panol-static-site
    region: oregon
    staticPublishPath: ./public
    routes:
      - type: rewrite
        source: /coordinacion
        destination: /coordinacion.html
      - type: rewrite
        source: /panol
        destination: /panol.html
      - type: rewrite
        source: /monitor
        destination: /panol.html
      - type: rewrite
        source: /mobile
        destination: /mobile.html
      - type: rewrite
        source: /m
        destination: /mobile.html
      - type: rewrite
        source: /app-mecanico
        destination: /mobile.html
      - type: rewrite
        source: /login
        destination: /login.html
      - type: rewrite
        source: /wireframe
        destination: /coordinacion.html
      - type: rewrite
        source: /terminal
        destination: /index.html
      - type: rewrite
        source: /legacy
        destination: /index.html

  # ==============================================================
  # 🔄 WEB SERVICE EN RENDER (Backend Node.js + APIs + WebSockets)
  # Ejecuta el microservicio en la raíz con node index.js
  # ==============================================================
  - type: web
    name: panol-monolith-service
    env: node
    plan: free
    region: oregon
    buildCommand: npm install
    startCommand: node index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: SPREADSHEET_ID
        value: 1aKptNgy8a9Ca3rDW-HSlWEiriMRJMOIJuFsdViwEGFc
      - key: SOURCE_SPREADSHEET_ID
        value: 1HKXGsRC149Kw4aBXQwGcPVpAvObvTUFis6YV6R5cTXk
      - key: MES_MOVIMIENTOS_ID
        value: 1Bwj8WCykMn_FbZhQ_FqnDH3K_WCod52YTSvsaxIDNS8
      - key: OT_SYNC_INTERVAL_MINUTES
        value: 2
      - key: SYSTEM_USER
        value: taller
      - key: SYSTEM_PASSWORD
        value: taller2026
      - key: SYSTEM_AUTH_SECRET
        value: panol-secret-auth-key-2026-xyz
      - key: DIAGRAMAS_URL
        value: https://diagramasnode-production.up.railway.app/api/datos
      - key: PG_MAX_CONNECTIONS
        value: "5"
      - key: PG_IDLE_TIMEOUT
        value: "10000"

