  # ------------------------------------------------------------
  # 2. FRONTEND DASH (Static Site — React 19 / Vite)
  # ------------------------------------------------------------
  - type: static
    name: dash
    region: oregon
    rootDir: apps/dash-frontend
    buildCommand: npm install && npm run build
