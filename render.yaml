services:
  # ------------------------------------------------------------
  # 1. SERVICIO MAESTRO (Docker Multi-Runtime Python + Node.js)
  # ------------------------------------------------------------
  - type: web
    name: diaria-operativas
    env: docker
    plan: starter
    region: oregon
    dockerfilePath: Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PORT
        value: 10000
      - key: TZ
        value: America/Argentina/Buenos_Aires
      - key: ENABLE_SCHEDULER
        value: "true"
      - key: NODE_TLS_REJECT_UNAUTHORIZED
        value: "0"
      # Conexión Directa a PostgreSQL (Pooler puerto 6543)
      - key: DATABASE_URL
        value: postgresql://postgres.rsvajuxihvmpmrmlcbul:kMmGplQEcWDYUBAB@aws-0-us-east-1.pooler.supabase.com:6543/postgres
      - key: PG_MAX_CONNECTIONS
        value: 5
      - key: PG_IDLE_TIMEOUT
        value: 10000
      - key: KM_RAM_DIAS
        value: 60
      - key: ENABLE_RAM_CACHE_POLLING
        value: "false"
      # Supabase Fallback API
      - key: SUPABASE_URL
        value: https://rsvajuxihvmpmrmlcbul.supabase.co
      - key: SUPABASE_KEY
        value: sb_publishable_n97mVkSclRpuv_OsseO3gg_BjR9QT3R
