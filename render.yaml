  # ------------------------------------------------------------
  # 2. FRONTEND DASH (Static Site — React 19 / Vite)
  # ------------------------------------------------------------
  - type: static
    name: dash
    region: oregon
    rootDir: apps/dash-frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://diaria-operativas.onrender.com
      - key: VITE_SOCKET_URL
        value: https://diaria-operativas.onrender.com

  # ------------------------------------------------------------
  # 3. FRONTEND EOR / DIAGRAMAS (Static Site — React / Vite)
  # ------------------------------------------------------------
  - type: static
    name: eor
    region: oregon
    rootDir: apps/eor-frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://diaria-operativas.onrender.com
      - key: VITE_SUPABASE_URL
        value: https://rsvajuxihvmpmrmlcbul.supabase.co
