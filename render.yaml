  # ------------------------------------------------------------
  # 4. FRONTEND BASE / PLANEACIÓN Y TALLER (Static Site — React / Vite)
  # ------------------------------------------------------------
  - type: static
    name: base
    region: oregon
    rootDir: apps/base-frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /coordinacion
        destination: /coordinacion.html
      - type: rewrite
        source: /taller
        destination: /taller.html
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://diaria-operativas.onrender.com
      - key: VITE_SOCKET_URL
        value: https://diaria-operativas.onrender.com
