    env: docker
    plan: starter
    region: oregon
    dockerfilePath: Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PORT
        value: 10000
      - key: TZ
        value: America/Argentina/Buenos_Aires
      - key: ENABLE_SCHEDULER
        value: "true"
      - key: NODE_TLS_REJECT_UNAUTHORIZED
        value: "0"
      # Conexión Directa a PostgreSQL (Pooler puerto 6543)
